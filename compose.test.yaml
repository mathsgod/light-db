services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: light_db_test
      MYSQL_ROOT_HOST: '%'
    ports:
      - '127.0.0.1:${LIGHT_DB_TEST_PORT:-33390}:3306'
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 10s
