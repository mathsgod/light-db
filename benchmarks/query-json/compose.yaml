services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: query_json_bench
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: light_db_query_json_bench
    ports:
      - '127.0.0.1:${LIGHT_DB_QUERY_BENCH_PORT:-33391}:3306'
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 10s
