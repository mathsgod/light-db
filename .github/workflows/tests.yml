name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite:
    name: SQLite / PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, dom, xml, xmlwriter
          tools: composer:v2
          coverage: none
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Verify SQLite support
        run: php -r '$pdo = new PDO("sqlite::memory:"); if (version_compare($pdo->query("SELECT sqlite_version()")->fetchColumn(), "3.35.0", "<")) { throw new RuntimeException("SQLite 3.35+ required"); }'
      - name: Run SQLite tests
        run: vendor/bin/phpunit --fail-on-skipped
      - name: Static analysis
        if: matrix.php == '8.3'
        run: composer analyse

  mysql:
    name: MySQL 8 / PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: light_db_test
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plight_db_test --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      LIGHT_DB_TEST_USER: root
      LIGHT_DB_TEST_PASSWORD: light_db_test
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, dom, xml, xmlwriter
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Configure MySQL connection
        env:
          MYSQL_TEST_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: echo "LIGHT_DB_TEST_DSN=mysql:host=127.0.0.1;port=${MYSQL_TEST_PORT};charset=utf8mb4" >> "$GITHUB_ENV"
      - name: Verify MySQL connection
        run: php -r 'new PDO(getenv("LIGHT_DB_TEST_DSN"), getenv("LIGHT_DB_TEST_USER"), getenv("LIGHT_DB_TEST_PASSWORD"), [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);'
      - name: Run MySQL integration tests
        run: vendor/bin/phpunit --fail-on-skipped
